{% extends "base.html" %}
{% block title %}Login — {{ APP_NAME }}{% endblock %}

{% block content %}
<div class="card form-narrow">
  <div class="center" style="margin-bottom:8px;">
    <span class="eyebrow">Welcome back</span>
    <h2 style="margin:6px 0 0;">Sign in to {{ APP_NAME }}</h2>
    <p class="muted text-sm">Analyze URLs and view your scan history.</p>
  </div>
  <form method="POST" action="{{ url_for('auth.login') }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="form-group">
      <label for="username">Username</label>
      <input type="text" id="username" name="username" value="{{ username or '' }}"
             autocomplete="username" required autofocus>
    </div>
    <div class="form-group">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" autocomplete="current-password" required>
    </div>
    <button type="submit" class="btn btn-primary btn-block">Sign in</button>
  </form>
  <p class="hint center">No account yet? <a href="{{ url_for('auth.register') }}">Create one</a>.</p>
</div>
{% endblock %}
